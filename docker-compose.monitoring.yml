# Phase 5 — monitoring & alerting overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: iems-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - iems
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: iems-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - iems
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iems-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-iems_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - iems
    restart: unless-stopped

  db-backup:
    image: timescale/timescaledb:latest-pg16
    container_name: iems-db-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-iems_secret}
      POSTGRES_USER: ${POSTGRES_USER:-iems}
      POSTGRES_DB: ${POSTGRES_DB:-iems}
      POSTGRES_HOST: timescaledb
    volumes:
      - ./scripts/backup_timescaledb.sh:/backup.sh:ro
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash >/dev/null 2>&1 || true
        while true; do
          /backup.sh || echo "backup failed"
          sleep $${BACKUP_INTERVAL_SECONDS:-3600}
        done
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - iems
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
