global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: iems-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: iems-api
          instance_role: primary
  # When running compose profile `ha`, add a scrape for api-b:8000 (instance_role=secondary)
  # or use infra/monitoring/prometheus.ha.yml overlay.
