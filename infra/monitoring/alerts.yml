groups:
  - name: iems-reliability
    rules:
      - alert: IEMSApiDown
        expr: up{job="iems-api", instance_role="primary"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "iEMS API scrape target is down"
          description: "Prometheus cannot scrape primary iems-api for >1m (NFR-REL-01)."

      - alert: IEMSHighLatency
        expr: histogram_quantile(0.95, sum(rate(iems_http_request_duration_seconds_bucket[5m])) by (le, path)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "iEMS p95 latency > 3s"
          description: "Prediction/API latency budget (NFR-PER-01) at risk."

      - alert: IEMSErrorRate
        expr: |
          sum(rate(iems_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(iems_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "iEMS 5xx error rate > 5%"

  # E11 — real 99.95% SLO (NFR-REL-01)
  - name: iems-slo
    rules:
      - record: iems:api_availability:ratio_5m
        expr: avg_over_time(up{job="iems-api", instance_role="primary"}[5m])

      - record: iems:api_availability:ratio_30d
        expr: avg_over_time(up{job="iems-api", instance_role="primary"}[30d])

      - alert: IEMSAvailabilitySLOBreach
        expr: iems:api_availability:ratio_30d < 0.9995
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "iEMS 30d availability below 99.95% SLO"
          description: "NFR-REL-01 burn — check /readyz, HA api-b, and recent incidents."

      - alert: IEMSAvailabilityBurnFast
        # ~3% error budget burn in 1h relative to 99.95% (0.05% monthly budget)
        expr: (1 - iems:api_availability:ratio_5m) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "iEMS availability burn elevated (5m window)"
          description: "up{job=iems-api} average dropped below 99% over 5m."
