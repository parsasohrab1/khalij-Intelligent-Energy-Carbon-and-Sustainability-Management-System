apiVersion: apps/v1
kind: Deployment
metadata:
  name: iems-api
  labels:
    app: iems-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iems-api
  template:
    metadata:
      labels:
        app: iems-api
    spec:
      containers:
        - name: api
          image: iems-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: iems-secrets
            - configMapRef:
                name: iems-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: iems-api
spec:
  selector:
    app: iems-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iems-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: iems-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iems-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iems-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
