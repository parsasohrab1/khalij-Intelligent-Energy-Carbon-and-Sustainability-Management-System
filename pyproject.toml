[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iems"
version = "0.1.0"
description = "Intelligent Energy, Carbon & Sustainability Management System (iEMS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Khalij iEMS Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "aiokafka>=0.12.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "mlflow>=2.18.0",
    "python-multipart>=0.0.17",
    "PyYAML>=6.0.2",
    "prometheus_client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "torch>=2.5.0",
]
opcua = [
    "asyncua>=1.1.0",
]

[project.scripts]
iems-api = "app.main:run"
iems-generate-data = "scripts.generate_synthetic_data:main"
iems-producer = "app.ingestion.producer:main"
iems-consumer = "app.ingestion.consumer:main"
iems-carbon-scheduler = "app.carbon.scheduler:main"
iems-ml-trainer = "app.ml.trainer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
